<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontaktkarte</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/contact-card.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="page-shell">
        <article class="contact-card" aria-label="Kontaktkarte von Max Mustermann">
            <div class="photo-stage">
                <img src="250310-Alexander-Krause-webseit.jpg" alt="Portraet von Max Mustermann">
                <button class="menu-fab" type="button" aria-label="Mitarbeiterinfos anzeigen" aria-expanded="false">
                    <span class="menu-bars" aria-hidden="true">
                        <span></span>
                        <span></span>
                    </span>
                </button>
            </div>

            <header class="name-strip">
                <h1>Alexander Krause</h1>
                <p class="name-strip-role">Verkaufsberater</p>
            </header>

            <section class="employee-info" aria-label="Mitarbeiterdetails">
                <div class="info-header">
                    <span class="info-name">Alexander Krause</span>
                    <span class="info-role">Verkaufsberater</span>
                </div>

                <ul class="info-list">
                    <li>
                        <i class="fa-solid fa-phone"></i>
                        <div>
                            <p class="label">Telefon</p>
                            <a href="tel:+49123456789">+490 151 21228625</a>
                        </div>
                    </li>
                    <li>
                        <i class="fa-solid fa-mobile-screen-button"></i>
                        <div>
                            <p class="label">Mobilnummer</p>
                            <a href="tel:+49015121228625">+490 151 21228625</a>
                        </div>
                    </li>
                    <li>
                        <i class="fa-solid fa-envelope"></i>
                        <div>
                            <p class="label">E-Mail</p>
                            <a href="mailto:a.krause@bleker-gruppe.de">a.krause@bleker-gruppe.de</a>
                        </div>
                    </li>
                    <li>
                        <i class="fa-solid fa-location-dot"></i>
                        <div>
                            <p class="label">Standort</p>
                            <a class="map-link" href="https://maps.google.com/?q=Borken+Autohaus+Twent" target="_blank" rel="noopener">Münster, Autoforum Bleker <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                        </div>
                    </li>
                    <li>
                        <i class="fa-solid fa-car"></i>
                        <div>
                            <p class="label">Marken</p>
                            <div class="brand-tags">
                                <span class="brand-logo" tabindex="0" data-brand="Citroën" aria-label="Citroën" title="Citroën"><img src="marken/logo_g_citroen.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="DS Automobiles" aria-label="DS Automobiles" title="DS Automobiles"><img src="marken/logo_g_ds.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Peugeot" aria-label="Peugeot" title="Peugeot"><img src="marken/logo_g_peugeot.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Renault" aria-label="Renault" title="Renault"><img src="marken/logo_g_renault.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Opel" aria-label="Opel" title="Opel"><img src="marken/logo_g_opel.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Dacia" aria-label="Dacia" title="Dacia"><img src="marken/logo_g_dacia.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Nissan" aria-label="Nissan" title="Nissan"><img src="marken/logo_g_nissan.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Kia" aria-label="Kia" title="Kia"><img src="marken/logo_g_kia.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Suzuki" aria-label="Suzuki" title="Suzuki"><img src="marken/logo_g_suzuki.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Alfa Romeo" aria-label="Alfa Romeo" title="Alfa Romeo"><img src="marken/logo_g_alfa.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Jeep" aria-label="Jeep" title="Jeep"><img src="marken/logo_g_jeep.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Fiat" aria-label="Fiat" title="Fiat"><img src="marken/logo_g_fiat.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Leapmotor" aria-label="Leapmotor" title="Leapmotor"><img src="marken/logo_g_leapmotor.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="XPeng" aria-label="XPeng" title="XPeng"><img src="marken/logo_g_xpeng.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="BYD" aria-label="BYD" title="BYD"><img src="marken/logo_g_byd.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Abarth" aria-label="Abarth" title="Abarth"><img src="marken/logo_g_abarth.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Maserati" aria-label="Maserati" title="Maserati"><img src="marken/logo_g_maserati.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="Alpine" aria-label="Alpine" title="Alpine"><img src="marken/logo_g_alpine.svg" alt=""></span>
                                <span class="brand-logo" tabindex="0" data-brand="SILENCE O" aria-label="SILENCE O" title="SILENCE O"><img src="marken/logo_g_silence.svg" alt=""></span>
                            </div>
                        </div>
                    </li>
                </ul>

                <a class="callback-btn" href="mailto:max.mustermann@bleker-gruppe.de?subject=Rueckrufwunsch">
                    <i class="fa-solid fa-phone-volume"></i> Rückrufwunsch
                </a>
            </section>
        </article>
    </main>

    <script src="script/contact-card.js"></script>
</body>
</html>
